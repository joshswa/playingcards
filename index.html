<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css"></link>
  <title>Playing Cards</title>
  
</head>

<body>
  <main id="playing-cards">
    <div class="card">
      <div class="left">
        <p>A</p>
        <p>♠</p>
      </div>
      <div class="middle largeIcon">
        <div>♠</div>
      </div>
      <div class="right">
        <p>A</p>
        <p>♠</p>
      </div>
    </div>
    <div class="card">
      <div class="left">
        <p>2</p>
        <p>♣</p>
      </div>
      <div class="middle largeIcon">
        <div>♣</div>
        <div class="rotate">♣</div>
      </div>
      <div class="right">
        <p>2</p>
        <p>♣</p>
      </div>
    </div>
    <div class="card red" >
      <div class="left">
        <p>3</p>
        <p>♥</p>
      </div>
      <div class="middle largeIcon">
        <div>♥</div>
        <div>♥</div>
        <div class="rotate">♥</div>
      </div>
      <div class="right">
        <p>3</p>
        <p>♥</p>
      </div>
    </div>
    <div class="card">
      <div class="left">
        <p>4</p>
        <p>♣</div>
      <div class="thisColumn largeIcon middle">
        <div class="middleIcon">
          <p>♣</p>
          <p>♣</p>
        </div>
        <div class="middleIcon rotate">
          <p>♣</p>
          <p>♣</p>
        </div>
        
      </div>
      <div class="right">
        <p>4</p>
        <p>♣</p>

      </div>
    </div>
    <div class="card red">
      <div class="left">
        <p>5</p>
        <p>♦</div>
      <div class="middle largeIcon">
        
        <div>1</div> 
        <div>2</div> 
        <div>3</div> 
        <div>4</div> 
        <div>5</div> 
      </div>
      <div class="right">
        <p>5</p>
        <p>♦</div>
      </div>
    </div>
  </main>
</body>

</html>
